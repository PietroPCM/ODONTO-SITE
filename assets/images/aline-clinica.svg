<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ebd9"/>
      <stop offset="1" stop-color="#e6d6bd"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e2d3"/>
    </linearGradient>
    <radialGradient id="cskin" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6d7c1"/>
      <stop offset="1" stop-color="#e2b89e"/>
    </radialGradient>
  </defs>
  <rect width="640" height="780" fill="url(#cbg)"/>

  <!-- shelf in background -->
  <rect x="380" y="40" width="200" height="280" fill="#fffaf0" opacity="0.6"/>
  <line x1="380" y1="140" x2="580" y2="140" stroke="#d0c0a0" stroke-width="2"/>
  <line x1="380" y1="220" x2="580" y2="220" stroke="#d0c0a0" stroke-width="2"/>

  <!-- desk -->
  <rect x="0" y="600" width="640" height="180" fill="#c9a981"/>
  <rect x="0" y="600" width="640" height="6" fill="#a88860"/>

  <!-- dinosaur toy -->
  <g transform="translate(480 560)">
    <circle cx="0" cy="40" r="40" fill="#e85b6e"/>
    <ellipse cx="-5" cy="0" rx="32" ry="34" fill="#5fb8d6"/>
    <circle cx="-15" cy="-5" r="4" fill="#fff"/>
    <circle cx="-15" cy="-5" r="2" fill="#2a3a4a"/>
    <path d="M-28 5 L-22 12 L-16 5 L-10 12 L-4 5" stroke="#fff" stroke-width="2" fill="none"/>
  </g>

  <!-- denture toy -->
  <g transform="translate(280 620)">
    <ellipse cx="0" cy="0" rx="50" ry="22" fill="#ffd9e0"/>
    <ellipse cx="0" cy="-2" rx="42" ry="14" fill="#fff"/>
    <line x1="-30" y1="-5" x2="-30" y2="8" stroke="#ddbcc4" stroke-width="1"/>
    <line x1="-15" y1="-5" x2="-15" y2="8" stroke="#ddbcc4" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="8" stroke="#ddbcc4" stroke-width="1"/>
    <line x1="15" y1="-5" x2="15" y2="8" stroke="#ddbcc4" stroke-width="1"/>
    <line x1="30" y1="-5" x2="30" y2="8" stroke="#ddbcc4" stroke-width="1"/>
  </g>

  <!-- brush/instrument -->
  <g transform="translate(170 620) rotate(-15)">
    <rect x="0" y="0" width="80" height="10" rx="5" fill="#7ed3a8"/>
    <rect x="80" y="-2" width="20" height="14" rx="3" fill="#fff"/>
  </g>

  <!-- figure: Aline with hand on cheek -->
  <g transform="translate(220 500)">
    <!-- coat -->
    <path d="M-130 250 C-130 100 -80 30 0 30 C80 30 130 100 130 250 Z" fill="url(#coat)"/>
    <!-- super hero pattern hints -->
    <circle cx="-50" cy="120" r="14" fill="#e85b6e" opacity="0.7"/>
    <circle cx="40" cy="150" r="12" fill="#3a78d0" opacity="0.7"/>
    <circle cx="-20" cy="180" r="10" fill="#f5c84b" opacity="0.7"/>
    <circle cx="60" cy="100" r="11" fill="#3a78d0" opacity="0.6"/>
    <!-- collar red -->
    <path d="M-50 30 L-30 80 L30 80 L50 30 Z" fill="#c1334a"/>
    <!-- neck -->
    <path d="M-22 5 L22 5 L18 35 L-18 35 Z" fill="url(#cskin)"/>
    <!-- head tilted slightly -->
    <ellipse cx="-8" cy="-55" rx="65" ry="75" fill="url(#cskin)"/>
    <!-- hair -->
    <path d="M-78 -85 C-85 -10 -65 65 -35 75 C-25 30 -28 -30 -45 -85 Z" fill="#5e3a26"/>
    <path d="M62 -85 C68 -10 50 65 20 80 C12 30 18 -30 30 -85 Z" fill="#5e3a26"/>
    <path d="M-72 -100 C-58 -150 42 -150 58 -100 C50 -120 -64 -120 -72 -100 Z" fill="#3a2014"/>
    <!-- hand under chin -->
    <ellipse cx="42" cy="20" rx="22" ry="16" fill="url(#cskin)" transform="rotate(-15 42 20)"/>
    <ellipse cx="55" cy="-5" rx="14" ry="22" fill="url(#cskin)" transform="rotate(20 55 -5)"/>
    <!-- arm -->
    <path d="M55 30 C70 60 95 110 110 220 L130 230 L130 30 Z" fill="url(#coat)"/>
    <!-- smile -->
    <path d="M-22 -22 Q-8 -10 8 -22" stroke="#a85d5a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="-26" cy="-50" r="3" fill="#3a2014"/>
    <circle cx="14" cy="-48" r="3" fill="#3a2014"/>
    <!-- earring -->
    <circle cx="-55" cy="-30" r="3" fill="#d4b76a"/>
  </g>

  <!-- caption -->
  <text x="320" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#5e3a26" opacity="0.85">cuidado leve, acolhedor e seguro</text>
</svg>
