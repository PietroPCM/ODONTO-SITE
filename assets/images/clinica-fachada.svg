<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bddde7"/>
      <stop offset="1" stop-color="#f5ebd9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a92a8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3d7387" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="480" height="600" fill="url(#sky)"/>

  <!-- building -->
  <rect x="0" y="40" width="480" height="560" fill="#2a3b46"/>

  <!-- upper window glass -->
  <rect x="20" y="60" width="440" height="300" fill="url(#glass)"/>
  <!-- mullions -->
  <line x1="130" y1="60" x2="130" y2="360" stroke="#1a2630" stroke-width="3"/>
  <line x1="240" y1="60" x2="240" y2="360" stroke="#1a2630" stroke-width="3"/>
  <line x1="350" y1="60" x2="350" y2="360" stroke="#1a2630" stroke-width="3"/>

  <!-- reflection of buildings -->
  <g opacity="0.35">
    <rect x="30" y="180" width="60" height="180" fill="#fff"/>
    <rect x="260" y="200" width="80" height="160" fill="#fff"/>
    <line x1="30" y1="220" x2="90" y2="220" stroke="#2a3b46"/>
    <line x1="30" y1="260" x2="90" y2="260" stroke="#2a3b46"/>
  </g>

  <!-- rainbow logo on glass -->
  <g transform="translate(240 230)">
    <path d="M-70 40 A70 70 0 0 1 70 40" stroke="#f3cbd1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-58 40 A58 58 0 0 1 58 40" stroke="#f5dfa8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-46 40 A46 46 0 0 1 46 40" stroke="#cce4d8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-34 40 A34 34 0 0 1 34 40" stroke="#ddd2ea" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-12 12 C-16 22 -14 35 0 42 C14 35 16 22 12 12 C6 6 -6 6 -12 12 Z" fill="none" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- sign band -->
  <rect x="0" y="360" width="480" height="80" fill="#1a2630"/>
  <text x="240" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#f3cbd1">Aline Sanfelice</text>
  <text x="240" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#bddde7">ODONTOPEDIATRIA AVANÇADA</text>

  <!-- doorway -->
  <rect x="180" y="440" width="120" height="160" fill="#0d1419"/>
  <rect x="180" y="440" width="120" height="160" fill="none" stroke="#5a92a8" stroke-width="2"/>
  <line x1="240" y1="440" x2="240" y2="600" stroke="#5a92a8" stroke-width="1"/>
  <circle cx="234" cy="520" r="2" fill="#bddde7"/>
  <circle cx="246" cy="520" r="2" fill="#bddde7"/>

  <!-- side panels with shop number / phone -->
  <rect x="0" y="440" width="180" height="160" fill="#1a2630"/>
  <text x="90" y="475" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#f3cbd1">Resp. Técnica</text>
  <text x="90" y="492" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#bddde7">Dra. Aline Sanfelice</text>
  <text x="90" y="508" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#bddde7">CRO PR 22438</text>
  <text x="90" y="556" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">45 98433-3443</text>

  <rect x="300" y="440" width="180" height="160" fill="#1a2630"/>
  <text x="390" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#fff">1850</text>
  <text x="390" y="540" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#bddde7">R. FORTALEZA</text>
  <text x="390" y="558" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2" fill="#bddde7">CENTRO • CASCAVEL/PR</text>
</svg>
