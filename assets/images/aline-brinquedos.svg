<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3e3"/>
      <stop offset="1" stop-color="#f3dec0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bbg)"/>

  <!-- soft rainbow arc behind -->
  <g transform="translate(320 480)" opacity="0.5">
    <path d="M-260 0 A260 260 0 0 1 260 0" stroke="#f3cbd1" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M-220 0 A220 220 0 0 1 220 0" stroke="#f5dfa8" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M-180 0 A180 180 0 0 1 180 0" stroke="#cce4d8" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M-140 0 A140 140 0 0 1 140 0" stroke="#bddde7" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- desk surface -->
  <path d="M0 480 L640 480 L640 640 L0 640 Z" fill="#d6b182"/>

  <!-- toothbrush -->
  <g transform="translate(120 420) rotate(-20)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#5fb8d6"/>
    <rect x="170" y="-4" width="40" height="30" rx="6" fill="#fff"/>
    <line x1="178" y1="0" x2="178" y2="-8" stroke="#bcd" stroke-width="1"/>
    <line x1="186" y1="0" x2="186" y2="-10" stroke="#bcd" stroke-width="1"/>
    <line x1="194" y1="0" x2="194" y2="-8" stroke="#bcd" stroke-width="1"/>
    <line x1="202" y1="0" x2="202" y2="-10" stroke="#bcd" stroke-width="1"/>
  </g>

  <!-- toothpaste -->
  <g transform="translate(420 430)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#f5c0c8"/>
    <rect x="155" y="8" width="22" height="24" rx="4" fill="#c1334a"/>
    <text x="80" y="26" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">SORRISO</text>
  </g>

  <!-- tooth toy main -->
  <g transform="translate(320 320)">
    <circle r="100" fill="#fff" stroke="#143b46" stroke-width="3"/>
    <path d="M-50 -30 C-60 0 -55 60 -25 75 C-10 65 -5 65 10 75 C40 60 50 0 40 -30 C20 -45 -30 -45 -50 -30 Z"
          fill="#fff5e8" stroke="#143b46" stroke-width="2"/>
    <!-- happy eyes -->
    <circle cx="-20" cy="-5" r="4" fill="#143b46"/>
    <circle cx="20" cy="-5" r="4" fill="#143b46"/>
    <!-- smile -->
    <path d="M-22 18 Q0 32 22 18" stroke="#c1334a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- sparkle -->
    <g transform="translate(-50 -55)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#f5dfa8"/>
    </g>
  </g>

  <!-- caption -->
  <text x="320" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#7a5a3a">ambiente lúdico que acolhe</text>
</svg>
